Mutation:
    type: object
    config:
        fields:
            createDinosaur:
                type: 'Dinosaur!'
                args: { input: { type: 'CreateDinosaurInput!' } }
                resolve: |
                    @=mutation(
                    "createDinosaur",
                    args["input"]
                    )
            login:
                type: 'String!'
                args:
                    email: { type: 'String!' }
                    password: { type: 'String!' }
                resolve: |
                    @=mutation(
                    "login",
                    args["email"],
                    args["password"]
                    )
