Mutation:
    type: object
    config:
        fields:
            createDinosaur:
                type: 'Dinosaur!'
                # access: "@=isGranted('DINOSAUR_CREATE')"
                args: { input: { type: 'CreateDinosaurInput!' } }
                resolve: |
                    @=mutation(
                    "createDinosaur",
                    args["input"]
                    )
            removeDinosaur:
                type: 'ID!'
                # access: "@=isGranted('DINOSAUR_REMOVE')"
                args: { id: { type: 'ID!' } }
                resolve: |
                    @=mutation(
                    "removeDinosaur",
                    args["id"]
                    )
            login:
                type: 'String!'
                args:
                    email: { type: 'String!' }
                    password: { type: 'String!' }
                resolve: |
                    @=mutation(
                    "login",
                    args["email"],
                    args["password"]
                    )
